services:
  tutor-ia:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - ./sources:/app/sources
      - ./chroma_db:/app/chroma_db
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
